# Andar SKIP (concierge) - Hermes com internet.
# Fala com o médico no Telegram, pesquisa, revisa LGPD e CFM, registra decisões.
# Subir:  ./predio subir skip      Ver:  ./predio status | ./predio auditar
services:
  skip:
    image: nousresearch/hermes-agent:stable
    container_name: predio-skip
    command: ["gateway", "run"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.5
    shm_size: "1g"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      predio.andar: "skip"
      predio.tipo: "hermes"
      predio.funcao: "concierge: conversa com o médico, pesquisa, revisa LGPD e CFM"
      predio.internet: "sim"
    volumes:
      # Memória do Hermes (escrita). Fica FORA do repositório: tem chaves e conversas.
      - ${PREDIO_DADOS:-/opt/predio-dados}/skip:/opt/data
      # Skills e SOUL vêm do repositório e são SÓ LEITURA para o agente.
      # Para mudar, edite no GitHub e rode: ./predio atualizar && ./predio reconstruir skip
      - ./skills/skip:/opt/data/skills/skip:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro
      # Pasta de troca com os outros andares (única onde o skip escreve fora da memória).
      # Inclui correio/config/: conta do Instagram e perfis de referência, editáveis pelo Telegram.
      - ${PREDIO_DADOS:-/opt/predio-dados}/correio:/opt/correio
      # Identidade das marcas (só leitura), usada pela revisão de conformidade.
      - ${PREDIO_DADOS:-/opt/predio-dados}/marca:/opt/marca:ro
    networks: [predio_externa]
networks:
  predio_externa:
    external: true
