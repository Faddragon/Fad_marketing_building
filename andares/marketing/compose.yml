# Andar MARKETING (estúdio de criação) - Hermes SEM internet.
# Só alcança o modelo de IA e o Telegram do dono, e só pelo porteiro (lista branca em andares/porteiro/filtro.txt).
# Subir:  ./predio subir marketing     Ver:  ./predio status | ./predio auditar
services:
  marketing:
    image: nousresearch/hermes-agent:stable
    container_name: predio-marketing
    command: ["gateway", "run"]
    restart: unless-stopped
    mem_limit: 2g        # igual ao contêiner atual (2 GB)
    cpus: 0.75           # igual ao contêiner atual
    shm_size: "1g"       # igual ao atual
    pids_limit: 256      # igual ao atual
    security_opt:
      - no-new-privileges:true   # igual ao atual
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      predio.andar: "marketing"
      predio.tipo: "hermes"
      predio.funcao: "estúdio de criação: carrossel, roteiros, ganchos, LinkedIn, arte"
      predio.internet: "nao (só o modelo de IA e o Telegram do dono, pelo porteiro)"
    environment:
      HTTP_PROXY: http://predio-porteiro:8888
      HTTPS_PROXY: http://predio-porteiro:8888
      http_proxy: http://predio-porteiro:8888
      https_proxy: http://predio-porteiro:8888
      NO_PROXY: localhost,127.0.0.1,predio-skip
      no_proxy: localhost,127.0.0.1,predio-skip
    volumes:
      - ${PREDIO_DADOS:-/opt/predio-dados}/marketing:/opt/data
      - ./skills/marketing:/opt/data/skills/marketing:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro
      - ${PREDIO_DADOS:-/opt/predio-dados}/correio:/opt/correio
      - ${PREDIO_DADOS:-/opt/predio-dados}/marca:/opt/marca
    networks: [predio_interna]   # rede interna: sem rota para a internet
networks:
  predio_interna:
    external: true
